name: Daily Airfare Scrape

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  scrape-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install playwright==1.40.0
          pip install httpx==0.24.1
          pip install gotrue==1.3.0
          pip install postgrest==0.10.8
          pip install supabase==1.2.0
          pip install python-dotenv
          pip install fastapi
          pip install uvicorn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libgbm1 \
            libasound2t64

      - name: Install Chromium browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: |
          echo "Starting scrape at $(date)"
          python scraper/run_scraper.py
          echo "Scrape complete at $(date)"

      - name: Calculate index
        run: |
          echo "Computing APIx at $(date)"
          python index/calculate_index.py
          echo "Index saved"

      - name: Print database stats
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from backend.database import get_stats_cloud
          stats = get_stats_cloud()
          print('=== SCRAPE SUMMARY ===')
          for k,v in stats.items():
              print(f'  {k}: {v}')
          "
