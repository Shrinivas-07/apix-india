# .github/workflows/daily_scrape.yml
# Runs automatically every night at 11:30 PM IST (6:00 PM UTC)
# Scrapes all routes, cleans data, computes index, saves to Supabase

name: Daily Airfare Scrape

on:
  schedule:
    - cron: '0 18 * * *'   # 6:00 PM UTC = 11:30 PM IST every day
  workflow_dispatch:         # also allows manual trigger from GitHub UI

jobs:
  scrape-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # kill job if it runs over 90 minutes

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      # ── 1. Get the code ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install playwright==1.40.0 supabase==1.2.0 python-dotenv fastapi

      # ── 4. Install Playwright browser ─────────────────────────────────────
      - name: Install Chromium browser
        run: playwright install chromium --with-deps

      # ── 5. Run scraper (all routes × all windows) ─────────────────────────
      - name: Run scraper
        run: |
          echo "Starting scrape at $(date)"
          python scraper/run_scraper.py
          echo "Scrape complete at $(date)"

      # ── 6. Compute today's APIx ───────────────────────────────────────────
      - name: Calculate index
        run: |
          echo "Computing APIx at $(date)"
          python index/calculate_index.py
          echo "Index saved"

      # ── 7. Print summary ──────────────────────────────────────────────────
      - name: Print database stats
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from backend.database import get_stats_cloud
          stats = get_stats_cloud()
          print('=== SCRAPE SUMMARY ===')
          for k,v in stats.items():
              print(f'  {k}: {v}')
          "
