name: Daily Airfare Scrape

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  scrape-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install playwright==1.40.0
          pip install httpx==0.24.1
          pip install gotrue==1.3.0
          pip install postgrest==0.10.8
          pip install supabase==1.2.0
          pip install python-dotenv
          pip install fastapi
          pip install uvicorn

      - name: Install Chromium browser
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          python -m playwright install chromium

      - name: Verify browser install
        run: |
          chromium-browser --version
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); print('Playwright OK'); b.close(); p.stop()"

      - name: Run scraper
        run: |
          echo "Starting scrape at $(date)"
          python scraper/run_scraper.py
          echo "Scrape complete at $(date)"

      - name: Calculate index
        run: |
          echo "Computing APIx at $(date)"
          python index/calculate_index.py
          echo "Index saved"

      - name: Print database stats
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from backend.database import get_stats_cloud
          stats = get_stats_cloud()
          print('=== SCRAPE SUMMARY ===')
          for k,v in stats.items():
              print(f'  {k}: {v}')
          "